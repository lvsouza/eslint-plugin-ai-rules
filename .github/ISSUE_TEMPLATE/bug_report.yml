name: Bug report
description: Report a problem with the plugin
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include a minimal reproduction and your ESLint configuration.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the actual behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the relevant file tree, ESLint config and source snippet.
      render: text
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: eslint-plugin-ai-rules version
      placeholder: 0.4.0
    validations:
      required: true
  - type: input
    id: eslint-version
    attributes:
      label: ESLint version
      placeholder: 10.14.0
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: 24.0.0
    validations:
      required: true
  - type: input
    id: typescript-version
    attributes:
      label: TypeScript version
      placeholder: 5.6.0
  - type: textarea
    id: logs
    attributes:
      label: Error output
      description: Paste the full lint output or stack trace.
      render: text
